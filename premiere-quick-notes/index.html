<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quick Notes</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M5 3h10l4 4v14H5zM14 4v4h4" opacity=".35"/><path fill="currentColor" d="M8 11h8v1.6H8zm0 3.4h8V16H8zm0 3.4h5v1.6H8z"/></svg>
        </span>
        <span class="title">Quick Notes</span>
        <span class="count" id="count">0</span>
      </div>
      <div class="search">
        <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M10 4a6 6 0 1 1-3.9 10.6l-3.4 3.4-1.1-1.1 3.4-3.4A6 6 0 0 1 10 4m0 1.6a4.4 4.4 0 1 0 0 8.8 4.4 4.4 0 0 0 0-8.8"/></svg>
        <input id="search" type="text" placeholder="Search notes…" autocomplete="off" />
      </div>
    </header>

    <!-- Composer -->
    <section class="composer" id="composer">
      <textarea id="input" rows="3" placeholder="Type or paste a note… images too (Ctrl/Cmd + V)"></textarea>
      <div class="tray" id="tray"></div>
      <div class="composer-bar">
        <div class="left">
          <button class="icon-btn" id="btnTimecode" title="Insert playhead timecode">
            <svg viewBox="0 0 24 24" width="15" height="15"><path fill="currentColor" d="M12 3a9 9 0 1 1 0 18 9 9 0 0 1 0-18m0 1.7a7.3 7.3 0 1 0 0 14.6 7.3 7.3 0 0 0 0-14.6M11.2 7h1.6v4.7l3.4 2-.8 1.4-4.2-2.5z"/></svg>
          </button>
          <button class="icon-btn" id="btnImage" title="Add image from file">
            <svg viewBox="0 0 24 24" width="15" height="15"><path fill="currentColor" d="M4 5h16v14H4zm1.6 1.6v8.9l3.6-3.6 2.6 2.6 4-4 2.6 2.6V6.6zM9 8.2a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3"/></svg>
          </button>
          <input type="file" id="fileInput" accept="image/*" multiple hidden />
          <span class="hint">Ctrl/Cmd + Enter to save</span>
        </div>
        <button class="primary" id="btnAdd">
          <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M11.2 5h1.6v6.2H19v1.6h-6.2V19h-1.6v-6.2H5v-1.6h6.2z"/></svg>
          Add note
        </button>
      </div>
      <div class="drop-overlay">Drop images here</div>
    </section>

    <!-- Notes -->
    <main class="list" id="list"></main>

    <div class="empty" id="empty">
      <div class="empty-art">
        <span></span><span></span><span></span>
      </div>
      <p class="empty-title">No notes yet</p>
      <p class="empty-sub">Paste text or screenshots above to start.</p>
    </div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox"><img id="lightboxImg" alt="" /></div>

  <!-- Toasts -->
  <div class="toasts" id="toasts"></div>

  <script src="js/main.js"></script>
</body>
</html>
